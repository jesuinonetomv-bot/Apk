<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}.overlay{position:fixed;inset:0;pointer-events:none}.names{position:absolute;left:0;right:0;bottom:120px;text-align:center;color:#fff;text-shadow:0 2px 10px #000}.main{font:italic 600 clamp(34px,9vw,64px) Georgia}.sub{font-size:14px;letter-spacing:4px;margin-top:7px}.c{position:absolute;width:70px;height:70px;border:solid rgba(255,255,255,.85)}.tl{top:25px;left:25px;border-width:2px 0 0 2px}.tr{top:25px;right:25px;border-width:2px 2px 0 0}.bl{bottom:105px;left:25px;border-width:0 0 2px 2px}.br{bottom:105px;right:25px;border-width:0 2px 2px 0}.controls{position:fixed;bottom:25px;left:0;right:0;display:flex;justify-content:center;gap:28px}button{width:68px;height:68px;border:0;border-radius:50%;font-size:28px;background:#fff}.rec{display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);color:white;background:#000a;padding:8px 15px;border-radius:20px}</style></head><body><video id="v" autoplay muted playsinline></video><div class="overlay"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><div class="names"><div class="main">Jesuíno &amp; Vanessa</div><div class="sub">NOSSO MOMENTO</div></div></div><div class="rec" id="rec">🔴 REC</div><div class="controls"><button onclick="flip()">🔄</button><button onclick="photo()">📸</button><button id="record" onclick="startRec()">🎥</button><button id="stop" onclick="stopRec()" style="display:none">⏹</button></div><canvas id="c" hidden></canvas><script>let v=document.getElementById('v'),front=true,stream,media,chunks=[];async function cam(){if(stream)stream.getTracks().forEach(x=>x.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment'},audio:true});v.srcObject=stream;v.style.transform=front?'scaleX(-1)':'none'}catch(e){alert('Permita câmera e microfone nas permissões do aplicativo.')}}function flip(){front=!front;cam()}function overlay(x,w,h){x.fillStyle='white';x.textAlign='center';x.shadowColor='black';x.shadowBlur=10;x.font='italic 600 '+Math.round(w*.075)+'px Georgia';x.fillText('Jesuíno & Vanessa',w/2,h*.82);x.font=Math.round(w*.025)+'px Arial';x.fillText('NOSSO MOMENTO',w/2,h*.86)}function photo(){let c=document.getElementById('c'),w=v.videoWidth,h=v.videoHeight;c.width=w;c.height=h;let x=c.getContext('2d');if(front){x.translate(w,0);x.scale(-1,1)}x.drawImage(v,0,0,w,h);if(front)x.setTransform(1,0,0,1,0,0);overlay(x,w,h);let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='jesuino-vanessa.png';a.click()}function startRec(){chunks=[];try{media=new MediaRecorder(stream);media.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};media.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:media.mimeType}));a.download='jesuino-vanessa.webm';a.click()};media.start();document.getElementById('record').style.display='none';document.getElementById('stop').style.display='block';document.getElementById('rec').style.display='block'}catch(e){alert('Não foi possível iniciar a gravação.')}}function stopRec(){if(media)media.stop();document.getElementById('record').style.display='block';document.getElementById('stop').style.display='none';document.getElementById('rec').style.display='none'}cam();</script></body></html>
