<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#006f8b"><title>Conecta 2026 - Gerência de Energia e Automação</title><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#00141c;font-family:Arial,sans-serif}#video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;filter:saturate(.85) contrast(1.06)}#overlay{position:fixed;inset:0;pointer-events:none;z-index:5}.tech{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,64,82,.38),rgba(0,114,139,.10) 48%,rgba(0,20,28,.58)),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 38px),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 38px)}.glow{position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(0,194,214,.28),transparent 28%),radial-gradient(circle at 88% 72%,rgba(70,170,90,.20),transparent 25%)}.header{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.hydro{display:flex;align-items:center;gap:8px;color:#fff;text-shadow:0 2px 6px #000}.hmark{width:42px;height:42px;border:3px solid #fff;border-radius:50%;position:relative}.hmark:before,.hmark:after{content:"";position:absolute;background:#fff;left:9px;right:9px;height:3px}.hmark:before{top:12px;transform:rotate(28deg)}.hmark:after{bottom:12px;transform:rotate(-28deg)}.hydro span{font-size:clamp(22px,6vw,34px);font-weight:700;letter-spacing:.5px}.datetime{background:rgba(0,32,42,.72);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:12px;padding:7px 9px;text-align:center;backdrop-filter:blur(5px)}.date{font-size:14px;font-weight:800}.time{font-size:12px;margin-top:2px}.title{position:absolute;left:18px;right:18px;top:22%;color:#fff;text-shadow:0 4px 12px rgba(0,0,0,.85)}.title .kicker{font-size:clamp(14px,3.7vw,22px);letter-spacing:5px;font-weight:700;color:#7ce3ef}.title .main{font-size:clamp(50px,16vw,96px);font-weight:900;line-height:.86;letter-spacing:-3px}.title .year{color:#63c56f}.title .dept{margin-top:10px;font-size:clamp(18px,5vw,30px);font-weight:700}.chips{position:absolute;left:18px;right:18px;top:52%;display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 12px;border-radius:999px;background:rgba(0,90,112,.60);border:1px solid rgba(124,227,239,.7);color:#fff;font-size:12px;font-weight:700;backdrop-filter:blur(4px)}.innovation{position:absolute;left:18px;right:18px;bottom:108px;border-left:4px solid #63c56f;padding:10px 12px;background:rgba(0,27,36,.52);color:#fff;backdrop-filter:blur(4px)}.innovation .big{font-size:clamp(18px,5vw,30px);font-weight:900}.innovation .small{font-size:12px;margin-top:4px;color:#c9f7fb}#controls{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;z-index:20}button{width:56px;height:56px;border-radius:50%;border:2px solid #7ce3ef;background:rgba(0,47,61,.9);color:#fff;font-size:22px;box-shadow:0 4px 16px rgba(0,0,0,.45)}#flash.on{background:#63c56f;border-color:#63c56f}#stop{display:none;background:#7a1d1d;border-color:#ff9b9b}#cameraSelect{position:fixed;z-index:21;right:10px;top:145px;max-width:170px;background:rgba(0,47,61,.92);color:#fff;border:1px solid #7ce3ef;border-radius:8px;padding:6px;font-size:11px;display:none}#screenFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100;transition:opacity .05s}#screenFlash.fire{opacity:1}#status{position:fixed;z-index:21;top:118px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.58);color:#fff;padding:5px 9px;border-radius:12px;font-size:11px;white-space:nowrap}#rec{display:none;position:fixed;z-index:21;top:148px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;padding:6px 10px;border-radius:14px;font-size:12px;font-weight:700}#preview{display:none;position:fixed;inset:0;z-index:30;background:#00141cf2;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}#preview img{max-width:92vw;max-height:72vh;border:2px solid #7ce3ef;border-radius:10px}#preview button{width:auto;height:auto;border-radius:8px;padding:10px 14px;font-size:15px}</style></head><body><video id="video" autoplay muted playsinline></video><div id="overlay"><div class="tech"></div><div class="glow"></div><div class="header"><div class="hydro"><div class="hmark"></div><span>Hydro</span></div><div class="datetime"><div class="date" id="dateText"></div><div class="time" id="timeText"></div></div></div><div class="title"><div class="kicker">INOVAÇÃO • TECNOLOGIA</div><div class="main">CONECTA <span class="year">2026</span></div><div class="dept">Gerência de Energia e Automação</div></div><div class="chips"><div class="chip">⚡ Energia</div><div class="chip">⚙ Automação</div><div class="chip">◉ Digitalização</div><div class="chip">⌁ Confiabilidade</div></div><div class="innovation"><div class="big">Ideias que conectam. Soluções que transformam.</div><div class="small">Tecnologia aplicada à segurança, eficiência e excelência operacional.</div></div></div><div id="status">Câmera frontal</div><select id="cameraSelect"></select><div id="screenFlash"></div><div id="rec">🔴 REC 00:00</div><div id="controls"><button id="switch" title="Trocar câmera">🔄</button><button id="flash" title="Ativar flash no disparo">⚡</button><button id="capture" title="Tirar foto">📸</button><button id="start" title="Gravar vídeo">🎥</button><button id="stop" title="Parar vídeo">⏹</button></div><canvas id="photoCanvas" hidden></canvas><canvas id="recordCanvas" hidden></canvas><div id="preview"><img id="photoPreview"><div><button id="savePhoto">Salvar foto</button> <button id="retry">Voltar</button></div></div><script>
const video=document.querySelector('#video'),sel=document.querySelector('#cameraSelect'),statusEl=document.querySelector('#status'),flash=document.querySelector('#flash'),sf=document.querySelector('#screenFlash'),canvas=document.querySelector('#photoCanvas'),recordCanvas=document.querySelector('#recordCanvas'),prev=document.querySelector('#preview'),img=document.querySelector('#photoPreview'),startBtn=document.querySelector('#start'),stopBtn=document.querySelector('#stop'),recEl=document.querySelector('#rec');let stream=null,front=true,flashMode=false,screenMode=false,recorder=null,chunks=[],recording=false,recTimer=null,recStart=0;
function clock(){let d=new Date();dateText.textContent=d.toLocaleDateString('pt-BR');timeText.textContent=d.toLocaleTimeString('pt-BR',{hour12:false})}clock();setInterval(clock,1000);async function devices(){let ds=await navigator.mediaDevices.enumerateDevices();return ds.filter(x=>x.kind==='videoinput')}function hasTorch(t){try{let c=t.getCapabilities?.()||{};return c.torch===true||(Array.isArray(c.torch)&&c.torch.includes(true))}catch(e){return false}}async function open(c,audio=true){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:c,audio});video.srcObject=stream;await video.play().catch(()=>{});let t=stream.getVideoTracks()[0];screenMode=!hasTorch(t);statusEl.textContent=hasTorch(t)?'⚡ Flash físico disponível':'⚡ Flash de tela disponível';return t}async function populate(){let ds=await devices();sel.innerHTML='';ds.forEach((d,i)=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`Câmera ${i+1}`;sel.appendChild(o)});return ds}async function start(){try{await open({facingMode:'user',width:{ideal:1920},height:{ideal:1080}});video.style.transform='scaleX(-1)';await populate();screenMode=true}catch(e){alert('Não foi possível abrir a câmera')}}async function findRear(){front=false;video.style.transform='none';statusEl.textContent='Procurando câmera com flash...';let ds=await populate(),rear=ds.filter(d=>/back|rear|trase|environment/i.test(d.label));if(!rear.length)rear=ds;for(let d of rear){try{let t=await open({deviceId:{exact:d.deviceId},width:{ideal:1920},height:{ideal:1080}});sel.value=d.deviceId;if(hasTorch(t)){sel.style.display='block';screenMode=false;return}}catch(e){}}try{await open({facingMode:{exact:'environment'},width:{ideal:1920},height:{ideal:1080}})}catch(e){await open({facingMode:'environment'})}sel.style.display='block';screenMode=true}document.querySelector('#switch').onclick=async()=>{if(recording)return;if(front)await findRear();else{front=true;sel.style.display='none';await open({facingMode:'user',width:{ideal:1920},height:{ideal:1080}});video.style.transform='scaleX(-1)';screenMode=true}};sel.onchange=async()=>{if(recording)return;front=false;video.style.transform='none';let t=await open({deviceId:{exact:sel.value},width:{ideal:1920},height:{ideal:1080}});screenMode=!hasTorch(t)};flash.onclick=()=>{flashMode=!flashMode;flash.classList.toggle('on',flashMode);statusEl.textContent=flashMode?(screenMode?'⚡ Flash de tela ARMADO':'⚡ Flash físico ARMADO'):'Flash desligado'};
function overlay(c,w,h){let d=new Date();c.save();let g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(0,74,94,.46)');g.addColorStop(1,'rgba(0,20,28,.52)');c.fillStyle=g;c.fillRect(0,0,w,h);c.textAlign='left';c.shadowColor='#000';c.shadowBlur=10;c.fillStyle='#fff';c.font=`700 ${w*.055}px Arial`;c.fillText('◉  Hydro',w*.04,h*.08);c.fillStyle='#7ce3ef';c.font=`700 ${w*.028}px Arial`;c.fillText('INOVAÇÃO • TECNOLOGIA',w*.04,h*.17);c.fillStyle='#fff';c.font=`900 ${w*.13}px Arial`;c.fillText('CONECTA',w*.04,h*.26);c.fillStyle='#63c56f';c.font=`900 ${w*.13}px Arial`;c.fillText('2026',w*.04,h*.36);c.fillStyle='#fff';c.font=`700 ${w*.04}px Arial`;c.fillText('Gerência de Energia e Automação',w*.04,h*.42);c.textAlign='right';c.fillStyle='#fff';c.font=`700 ${w*.027}px Arial`;c.fillText(d.toLocaleDateString('pt-BR')+'  '+d.toLocaleTimeString('pt-BR',{hour12:false}),w*.96,h*.08);c.textAlign='left';c.fillStyle='#c9f7fb';c.font=`700 ${w*.028}px Arial`;c.fillText('⚡ Energia   ⚙ Automação   ◉ Digitalização',w*.04,h*.70);c.fillStyle='#fff';c.font=`900 ${w*.04}px Arial`;c.fillText('Ideias que conectam. Soluções que transformam.',w*.04,h*.87);c.restore()}
async function snap(){let t=stream.getVideoTracks()[0],s=t.getSettings(),w=s.width||video.videoWidth,h=s.height||video.videoHeight;canvas.width=w;canvas.height=h;let c=canvas.getContext('2d');if(front){c.save();c.translate(w,0);c.scale(-1,1);c.drawImage(video,0,0,w,h);c.restore()}else c.drawImage(video,0,0,w,h);overlay(c,w,h);img.src=canvas.toDataURL('image/png');prev.style.display='flex'}async function torchSet(on){let t=stream?.getVideoTracks()[0];if(!t||!hasTorch(t))return false;try{await t.applyConstraints({advanced:[{torch:on}]});return true}catch(e){try{await t.applyConstraints({torch:on});return true}catch(e2){return false}}}document.querySelector('#capture').onclick=async()=>{if(!stream||recording)return;if(flashMode&&!screenMode){let ok=await torchSet(true);if(ok){await new Promise(r=>setTimeout(r,220));await snap();await torchSet(false);return}else screenMode=true}if(flashMode&&screenMode){sf.classList.add('fire');await new Promise(r=>setTimeout(r,180));await snap();setTimeout(()=>sf.classList.remove('fire'),90)}else await snap()};document.querySelector('#savePhoto').onclick=()=>{let a=document.createElement('a'),d=new Date();a.href=img.src;a.download=`conecta-2026-${d.toISOString().replace(/[:.]/g,'-')}.png`;a.click()};document.querySelector('#retry').onclick=()=>prev.style.display='none';function recClock(){recStart=Date.now();recEl.style.display='block';recTimer=setInterval(()=>{let s=Math.floor((Date.now()-recStart)/1000);recEl.textContent=`🔴 REC ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},250)}function stopRecClock(){clearInterval(recTimer);recEl.style.display='none'}startBtn.onclick=()=>{if(!stream||recording)return;if(typeof MediaRecorder==='undefined'||typeof recordCanvas.captureStream!=='function'){alert('Este navegador não suporta gravação de vídeo.');return}let t=stream.getVideoTracks()[0],s=t.getSettings(),cw=s.width||1280,ch=s.height||720,w=720,h=Math.round(ch*(w/cw));recordCanvas.width=w;recordCanvas.height=h;let c=recordCanvas.getContext('2d');recording=true;chunks=[];function frame(){if(!recording)return;c.clearRect(0,0,w,h);if(front){c.save();c.translate(w,0);c.scale(-1,1);c.drawImage(video,0,0,w,h);c.restore()}else c.drawImage(video,0,0,w,h);overlay(c,w,h);requestAnimationFrame(frame)}frame();let cs=recordCanvas.captureStream(24),combined=new MediaStream();cs.getVideoTracks().forEach(x=>combined.addTrack(x));stream.getAudioTracks().forEach(x=>combined.addTrack(x));let opts={};if(MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus'))opts.mimeType='video/webm;codecs=vp8,opus';recorder=new MediaRecorder(combined,opts);recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onstop=()=>{let b=new Blob(chunks,{type:recorder.mimeType||'video/webm'}),u=URL.createObjectURL(b),a=document.createElement('a'),d=new Date();a.href=u;a.download=`conecta-2026-${d.toISOString().replace(/[:.]/g,'-')}.webm`;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};recorder.start();startBtn.style.display='none';stopBtn.style.display='inline-block';recClock()};stopBtn.onclick=()=>{if(recorder?.state==='recording')recorder.stop();recording=false;stopBtn.style.display='none';startBtn.style.display='inline-block';stopRecClock()};start();
</script></body></html>
