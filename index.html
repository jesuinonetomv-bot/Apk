<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000">
  <title>Jesuíno Neto</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    #video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover}
    #overlay{position:fixed;inset:0;pointer-events:none;z-index:5}

    .soft-vignette{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.12),transparent 22%,transparent 62%,rgba(0,0,0,.22));}

    .flower-cluster{position:absolute;font-size:clamp(24px,7vw,46px);filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));line-height:1.05;}
    .flowers-tl{top:18px;left:14px;transform:rotate(-10deg)}
    .flowers-tr{top:18px;right:14px;transform:rotate(10deg)}
    .flowers-bl{bottom:112px;left:10px;transform:rotate(8deg)}
    .flowers-br{bottom:112px;right:10px;transform:rotate(-8deg)}

    .sparkle{position:absolute;font-size:clamp(14px,4vw,24px);text-shadow:0 2px 6px rgba(0,0,0,.5)}
    .s1{top:18%;left:7%}.s2{top:14%;right:9%}.s3{top:48%;left:4%}.s4{top:42%;right:5%}

    .names{position:absolute;left:0;right:0;bottom:124px;text-align:center;padding:0 12px;text-shadow:0 3px 12px rgba(0,0,0,.9)}
    .names .main{font-family:"Brush Script MT","Segoe Script","URW Chancery L",cursive;font-size:clamp(46px,14vw,92px);font-weight:700;line-height:.92;background:linear-gradient(90deg,#ff6fa8,#ffd166,#8be28b,#67d5ff,#b79cff,#ff8fab);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.75)) drop-shadow(0 0 10px rgba(255,255,255,.18));}
    .names .sub{display:inline-block;margin-top:10px;padding:6px 13px;border-radius:999px;background:rgba(0,0,0,.34);color:#fff;font-size:13px;font-weight:700;letter-spacing:4px;text-transform:uppercase;border:1px solid rgba(255,255,255,.35)}

    #controls{position:fixed;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:28px;z-index:20}
    button{width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.94);color:#111;font-size:28px;box-shadow:0 5px 18px rgba(0,0,0,.42)}
    #stop{display:none;background:#ffe8ef}
    #rec{display:none;position:fixed;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;background:rgba(0,0,0,.68);color:#fff;padding:8px 14px;border-radius:20px;font-weight:bold}
    #preview{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}
    #preview img{max-width:92vw;max-height:72vh;border-radius:12px;border:2px solid #fff}
    #preview .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    #preview button{width:auto;height:auto;border-radius:10px;padding:12px 18px;font-size:16px}
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>

  <div id="overlay">
    <div class="soft-vignette"></div>
    <div class="flower-cluster flowers-tl">🌸🌼🌿</div>
    <div class="flower-cluster flowers-tr">🌺🌷🌿</div>
    <div class="flower-cluster flowers-bl">🌻🌸🍃</div>
    <div class="flower-cluster flowers-br">🌷🌼🍃</div>
    <div class="sparkle s1">✨</div><div class="sparkle s2">✨</div>
    <div class="sparkle s3">💫</div><div class="sparkle s4">✨</div>
    <div class="names">
      <div class="main">Jesuíno &amp; </div>
      <div class="sub">Meu momento </div>
    </div>
  </div>

  <div id="rec">🔴 REC 00:00</div>

  <div id="controls">
    <button id="switch" title="Trocar câmera">🔄</button>
    <button id="capture" title="Tirar foto">📸</button>
    <button id="start" title="Gravar vídeo">🎥</button>
    <button id="stop" title="Parar gravação">⏹</button>
  </div>

  <canvas id="photoCanvas" hidden></canvas>
  <canvas id="recordCanvas" hidden></canvas>

  <div id="preview">
    <img id="photoPreview" alt="Prévia">
    <div class="row">
      <button id="savePhoto">Salvar foto</button>
      <button id="retry">Voltar</button>
    </div>
  </div>

<script>
const video = document.getElementById('video');
const photoCanvas = document.getElementById('photoCanvas');
const recordCanvas = document.getElementById('recordCanvas');
const switchBtn = document.getElementById('switch');
const captureBtn = document.getElementById('capture');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const rec = document.getElementById('rec');
const preview = document.getElementById('preview');
const photoPreview = document.getElementById('photoPreview');
const savePhoto = document.getElementById('savePhoto');
const retry = document.getElementById('retry');
let front = true, stream = null, recorder = null, chunks = [], recording = false, timer = null, t0 = 0;

function flowerText(ctx,text,x,y,size,align='left'){
  ctx.save();ctx.font=`${size}px Arial`;ctx.textAlign=align;ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=Math.max(4,size*.12);ctx.fillText(text,x,y);ctx.restore();
}

function drawOverlay(ctx,w,h){
  ctx.save();
  const grad=ctx.createLinearGradient(0,0,w,0);
  grad.addColorStop(0,'#ff6fa8');grad.addColorStop(.2,'#ffd166');grad.addColorStop(.4,'#8be28b');grad.addColorStop(.6,'#67d5ff');grad.addColorStop(.8,'#b79cff');grad.addColorStop(1,'#ff8fab');

  const fs=Math.round(Math.min(w,h)*.055);
  flowerText(ctx,'🌸🌼🌿',w*.035,h*.09,fs,'left');
  flowerText(ctx,'🌺🌷🌿',w*.965,h*.09,fs,'right');
  flowerText(ctx,'🌻🌸🍃',w*.035,h*.84,fs,'left');
  flowerText(ctx,'🌷🌼🍃',w*.965,h*.84,fs,'right');

  ctx.textAlign='center';
  ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=12;
  ctx.fillStyle=grad;
  ctx.font=`700 ${Math.round(w*.105)}px "Brush Script MT", "Segoe Script", cursive`;
  ctx.fillText('Jesuíno & Vanessa',w/2,h*.79);

  ctx.shadowBlur=6;
  ctx.fillStyle='rgba(0,0,0,.42)';
  const pillW=w*.42,pillH=Math.max(30,h*.042),py=h*.805;
  ctx.beginPath();ctx.roundRect(w/2-pillW/2,py,pillW,pillH,pillH/2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(w*.026)}px Arial`;
  ctx.fillText('NOSSO MOMENTO',w/2,py+pillH*.67);
  ctx.restore();
}

async function startCamera(){
  if (stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment',width:{ideal:1920},height:{ideal:1080}},audio:true});
    video.srcObject=stream;
    video.style.transform=front?'scaleX(-1)':'none';
  }catch(err){alert('Não foi possível abrir a câmera/microfone. Verifique as permissões do navegador.');}
}

switchBtn.onclick=()=>{front=!front;startCamera()};

captureBtn.onclick=()=>{
  if(!stream) return;
  const track=stream.getVideoTracks()[0],s=track.getSettings();
  const w=s.width||video.videoWidth||1280,h=s.height||video.videoHeight||720;
  photoCanvas.width=w;photoCanvas.height=h;
  const c=photoCanvas.getContext('2d');
  if(front){c.save();c.translate(w,0);c.scale(-1,1);c.drawImage(video,0,0,w,h);c.restore();}else c.drawImage(video,0,0,w,h);
  drawOverlay(c,w,h);
  photoPreview.src=photoCanvas.toDataURL('image/png');preview.style.display='flex';
};

savePhoto.onclick=()=>{const a=document.createElement('a');a.href=photoPreview.src;a.download='jesuino-vanessa.png';a.click();};
retry.onclick=()=>preview.style.display='none';

function startTimer(){t0=Date.now();rec.style.display='block';timer=setInterval(()=>{const sec=Math.floor((Date.now()-t0)/1000);const m=String(Math.floor(sec/60)).padStart(2,'0');const s=String(sec%60).padStart(2,'0');rec.textContent=`🔴 REC ${m}:${s}`;},250)}
function stopTimer(){clearInterval(timer);timer=null;rec.style.display='none'}

startBtn.onclick=()=>{
  if(!stream||recording)return;
  if(typeof MediaRecorder==='undefined'||typeof recordCanvas.captureStream!=='function'){alert('Este navegador não suporta gravação de vídeo por esta página.');return;}
  const track=stream.getVideoTracks()[0],s=track.getSettings(),cw=s.width||1280,ch=s.height||720,w=720,h=Math.round(ch*(w/cw));
  recordCanvas.width=w;recordCanvas.height=h;const ctx=recordCanvas.getContext('2d');recording=true;chunks=[];
  function frame(){if(!recording)return;ctx.clearRect(0,0,w,h);if(front){ctx.save();ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,w,h);ctx.restore();}else ctx.drawImage(video,0,0,w,h);drawOverlay(ctx,w,h);requestAnimationFrame(frame)}frame();
  const canvasStream=recordCanvas.captureStream(24),combined=new MediaStream();canvasStream.getVideoTracks().forEach(t=>combined.addTrack(t));stream.getAudioTracks().forEach(t=>combined.addTrack(t));
  let opts={};if(MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus'))opts.mimeType='video/webm;codecs=vp8,opus';recorder=new MediaRecorder(combined,opts);
  recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
  recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jesuino-vanessa.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
  recorder.start();startBtn.style.display='none';stopBtn.style.display='inline-block';startTimer();
};

stopBtn.onclick=()=>{if(recorder?.state==='recording')recorder.stop();recording=false;stopBtn.style.display='none';startBtn.style.display='inline-block';stopTimer();};

startCamera();
</script>
</body>
</html>
