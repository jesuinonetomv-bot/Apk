<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>PAIDEX - Ciclismo de Longa Distância</title><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}#video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover}#overlay{position:fixed;inset:0;pointer-events:none;z-index:5}.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(224,212,0,.20),rgba(74,59,0,.10) 45%,rgba(0,0,0,.34));mix-blend-mode:screen}.topbar{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;gap:10px}.brand{color:#ffe116;text-shadow:0 3px 7px #000}.paidex{font-weight:1000;font-style:italic;letter-spacing:-4px;font-size:clamp(48px,15vw,92px);line-height:.8}.sub{font-size:clamp(12px,3.2vw,19px);font-style:italic;font-weight:700;margin-left:8px;margin-top:7px}.datetime{background:rgba(45,28,5,.78);border:2px solid #ffe116;color:#ffe116;border-radius:14px;padding:8px 10px;text-align:center;min-width:112px}.date{font-size:17px;font-weight:900}.time{font-size:13px;font-weight:800}.mango{position:absolute;left:18px;top:25%;color:#fff;text-shadow:0 3px 8px #000}.stage{font-family:cursive;font-size:clamp(20px,5vw,32px);font-style:italic}.fruit{font-size:clamp(34px,9vw,58px)}.mtitle{color:#ffd21d;font-size:clamp(24px,7vw,46px);font-weight:1000}.place{font-family:cursive;font-size:clamp(22px,6vw,40px);font-style:italic}.distance{position:absolute;left:10px;right:10px;bottom:95px;color:rgba(88,48,26,.62);font-weight:1000;font-size:clamp(92px,34vw,210px);line-height:.65;text-align:center;letter-spacing:-10px}.slogan{position:absolute;left:0;right:0;bottom:82px;text-align:center;color:#fff;font-size:clamp(20px,5.8vw,38px);font-style:italic;font-weight:900;text-shadow:0 4px 8px #000}#controls{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:13px;z-index:20}button{width:58px;height:58px;border-radius:50%;border:2px solid #ffe116;background:rgba(40,32,0,.88);color:#ffe116;font-size:23px}#flash.on{background:#ffe116;color:#111}#cameraSelect{position:fixed;z-index:21;right:10px;top:145px;max-width:170px;background:rgba(40,32,0,.88);color:#ffe116;border:1px solid #ffe116;border-radius:8px;padding:6px;font-size:11px;display:none}#screenFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100;transition:opacity .05s}#screenFlash.fire{opacity:1}#status{position:fixed;z-index:21;top:115px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:5px 9px;border-radius:12px;font-size:11px;white-space:nowrap}#preview{display:none;position:fixed;inset:0;z-index:30;background:#000e;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}#preview img{max-width:92vw;max-height:72vh;border:2px solid #ffe116}#preview button{width:auto;height:auto;border-radius:8px;padding:10px;font-size:15px}</style></head><body><video id="video" autoplay muted playsinline></video><div id="overlay"><div class="tint"></div><div class="topbar"><div class="brand"><div class="paidex">PAIDEX</div><div class="sub">CICLISMO DE LONGA DISTÂNCIA</div></div><div class="datetime"><div class="date" id="dateText"></div><div class="time" id="timeText"></div></div></div><div class="mango"><div class="stage">etapa</div><div class="fruit">🥭🥭🥭</div><div class="mtitle">MANGA</div><div class="place">Peixe-Boi</div></div><div class="distance">150KM</div><div class="slogan">DESISTIR NÃO É UMA OPÇÃO!</div></div><div id="status">Câmera frontal</div><select id="cameraSelect"></select><div id="screenFlash"></div><div id="controls"><button id="switch">🔄</button><button id="flash">⚡</button><button id="capture">📸</button></div><canvas id="photoCanvas" hidden></canvas><div id="preview"><img id="photoPreview"><div><button id="savePhoto">Salvar foto</button> <button id="retry">Voltar</button></div></div><script>const video=document.querySelector('#video'),sel=document.querySelector('#cameraSelect'),statusEl=document.querySelector('#status'),flash=document.querySelector('#flash'),sf=document.querySelector('#screenFlash'),canvas=document.querySelector('#photoCanvas'),prev=document.querySelector('#preview'),img=document.querySelector('#photoPreview');let stream=null,front=true,torch=false,screenMode=false;function clock(){let d=new Date();dateText.textContent=d.toLocaleDateString('pt-BR');timeText.textContent=d.toLocaleTimeString('pt-BR',{hour12:false})}clock();setInterval(clock,1000);async function devices(){let ds=await navigator.mediaDevices.enumerateDevices();return ds.filter(x=>x.kind==='videoinput')}function hasTorch(t){try{let c=t.getCapabilities?.()||{};return c.torch===true||(Array.isArray(c.torch)&&c.torch.includes(true))}catch(e){return false}}async function open(c){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:c,audio:false});video.srcObject=stream;await video.play().catch(()=>{});let t=stream.getVideoTracks()[0];torch=false;flash.classList.remove('on');if(hasTorch(t)){screenMode=false;statusEl.textContent='⚡ Flash físico disponível'}else{screenMode=true;statusEl.textContent='⚡ Flash de tela'}return t}async function populate(){let ds=await devices();sel.innerHTML='';ds.forEach((d,i)=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`Câmera ${i+1}`;sel.appendChild(o)});return ds}async function start(){try{await open({facingMode:'user',width:{ideal:1920},height:{ideal:1080}});video.style.transform='scaleX(-1)';await populate()}catch(e){alert('Não foi possível abrir a câmera')}}async function findRear(){front=false;video.style.transform='none';statusEl.textContent='Procurando câmera com flash...';let ds=await populate(),rear=ds.filter(d=>/back|rear|trase|environment/i.test(d.label));if(!rear.length)rear=ds;for(let d of rear){try{let t=await open({deviceId:{exact:d.deviceId},width:{ideal:1920},height:{ideal:1080}});sel.value=d.deviceId;if(hasTorch(t)){sel.style.display='block';statusEl.textContent='⚡ Flash físico disponível';return}}catch(e){}}try{await open({facingMode:{exact:'environment'},width:{ideal:1920},height:{ideal:1080}})}catch(e){await open({facingMode:'environment'})}sel.style.display='block';statusEl.textContent='Nenhuma câmera expôs flash — flash de tela'}document.querySelector('#switch').onclick=async()=>{if(front)await findRear();else{front=true;sel.style.display='none';await open({facingMode:'user',width:{ideal:1920},height:{ideal:1080}});video.style.transform='scaleX(-1)';statusEl.textContent='Câmera frontal — flash de tela';screenMode=true}};sel.onchange=async()=>{front=false;video.style.transform='none';await open({deviceId:{exact:sel.value},width:{ideal:1920},height:{ideal:1080}})};flash.onclick=async()=>{let t=stream?.getVideoTracks()[0];if(t&&hasTorch(t)){try{torch=!torch;await t.applyConstraints({advanced:[{torch}]});flash.classList.toggle('on',torch);statusEl.textContent=torch?'⚡ Flash físico LIGADO':'⚡ Flash físico disponível'}catch(e){screenMode=true;statusEl.textContent='Flash físico bloqueado — usando tela'}}else{screenMode=!screenMode;flash.classList.toggle('on',screenMode);statusEl.textContent=screenMode?'⚡ Flash de tela ligado':'Flash desligado'}};function overlay(c,w,h){let d=new Date();c.save();c.fillStyle='#ffe116';c.textAlign='left';c.shadowColor='#000';c.shadowBlur=10;c.font=`italic 900 ${w*.14}px Arial`;c.fillText('PAIDEX',w*.035,h*.1);c.fillStyle='#fff';c.font=`italic 700 ${w*.03}px Arial`;c.fillText('CICLISMO DE LONGA DISTÂNCIA',w*.05,h*.14);c.fillStyle='#ffe116';c.textAlign='right';c.font=`900 ${w*.03}px Arial`;c.fillText(d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour12:false}),w*.96,h*.19);c.textAlign='left';c.fillStyle='#ffd21d';c.font=`900 ${w*.07}px Arial`;c.fillText('🥭 MANGA',w*.05,h*.4);c.fillStyle='#fff';c.font=`italic ${w*.05}px cursive`;c.fillText('Peixe-Boi',w*.05,h*.46);c.textAlign='center';c.fillStyle='rgba(90,50,25,.6)';c.font=`1000 ${w*.27}px Arial`;c.fillText('150KM',w/2,h*.87);c.fillStyle='#fff';c.font=`italic 900 ${w*.043}px Arial`;c.fillText('DESISTIR NÃO É UMA OPÇÃO!',w/2,h*.93);c.restore()}async function snap(){let t=stream.getVideoTracks()[0],s=t.getSettings(),w=s.width||video.videoWidth,h=s.height||video.videoHeight;canvas.width=w;canvas.height=h;let c=canvas.getContext('2d');if(front){c.translate(w,0);c.scale(-1,1)}c.drawImage(video,0,0,w,h);overlay(c,w,h);img.src=canvas.toDataURL('image/png');prev.style.display='flex'}document.querySelector('#capture').onclick=async()=>{if(screenMode){sf.classList.add('fire');await new Promise(r=>setTimeout(r,200));await snap();setTimeout(()=>sf.classList.remove('fire'),100)}else await snap()};document.querySelector('#savePhoto').onclick=()=>{let a=document.createElement('a');a.href=img.src;a.download='paidex.png';a.click()};document.querySelector('#retry').onclick=()=>prev.style.display='none';start();</script></body></html>
