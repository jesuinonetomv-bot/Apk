<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050705"><title>Conecta 2026 • Câmera Teste</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#fff}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}.mirror{transform:scaleX(-1)}
#shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#0009,transparent 25%,transparent 60%,#000e)}
header{position:fixed;z-index:5;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:10px}
#logo{width:72px;height:50px;object-fit:contain}.name{font-size:25px;font-weight:900}.name b{color:#55cf67}.sub{font-size:10px;font-weight:700}
#tag{position:fixed;z-index:5;top:83px;left:14px;border-left:3px solid #55cf67;background:#0008;padding:7px 10px;font-size:12px;font-weight:900}
#tools{position:fixed;z-index:10;right:12px;top:14px;display:flex;gap:7px}.tool{width:42px;height:42px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:19px}.tool.on{background:#55cf67;color:#071009}
#format{position:fixed;z-index:10;right:14px;top:64px;border:1px solid #ffffff55;background:#000a;color:#fff;border-radius:18px;padding:6px 10px}
#panel{position:fixed;z-index:10;bottom:10px;left:0;right:0}.row{display:flex;gap:7px;overflow-x:auto;padding:4px 12px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;border:1px solid #ffffff45;background:#080a08cc;color:#fff;border-radius:20px;padding:8px 11px;font-size:10px;font-weight:800}.pill.active{border-color:#55cf67;color:#8cff9b;background:#18351ddd}
#modes{text-align:center;font-size:11px;font-weight:800;margin:4px}#modes span{padding:5px 9px}#modes .active{color:#55cf67}
#captureRow{height:76px;display:flex;justify-content:center;align-items:center;gap:25px}.small{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff66;background:#090b09dd;color:#fff;font-size:20px}
#shot,#record{width:67px;height:67px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 3px #55cf67}#shot{background:transparent}#record{display:none;background:#d72e2e}#stop{display:none;background:#9b1d1d}
#flashScreen{position:fixed;z-index:30;inset:0;background:#fff;opacity:0;pointer-events:none}#flashScreen.fire{opacity:1}
#preview{display:none;position:fixed;z-index:40;inset:0;background:#050705;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:15px}#preview img{max-width:94vw;max-height:78vh;border-radius:12px}
#preview button{position:relative;z-index:50;border:1px solid #55cf67;background:#111;color:#fff;border-radius:20px;padding:12px 18px;font-weight:700;touch-action:manipulation}
</style></head>
<body>
<video id="video" autoplay muted playsinline></video><div id="shade"></div>
<header><img id="logo" src="logo-hydro.png"><div><div class="name">CONECTA <b>2026</b></div><div class="sub">Gerência de Energia e Automação</div></div></header>
<div id="tag">CONECTA 2026 • GERAL</div>
<div id="tools"><button class="tool" id="flip">🔄</button><button class="tool" id="flash">⚡</button></div><button id="format">9:16</button>
<div id="panel"><div id="modes"><span id="photoMode" class="active">FOTO</span><span id="videoMode">VÍDEO</span></div>
<div class="row" id="areas"><button class="pill active" data-area="geral">GERAL</button><button class="pill" data-area="operacao">⚡ OPERAÇÃO</button><button class="pill" data-area="manutencao">🔧 MANUTENÇÃO</button><button class="pill" data-area="automacao">⚙ AUTOMAÇÃO</button></div>
<div class="row" id="effects"><button class="pill active" data-fx="natural">NATURAL</button><button class="pill" data-fx="vivo">VIVO</button><button class="pill" data-fx="frio">FRIO</button><button class="pill" data-fx="quente">QUENTE</button><button class="pill" data-fx="pb">P&B</button></div>
<div id="captureRow"><button class="small" id="last">▣</button><button id="shot"></button><button id="record"></button><button class="small" id="stop">■</button></div></div>
<div id="flashScreen"></div><canvas id="canvas" hidden></canvas><canvas id="recCanvas" hidden></canvas>
<div id="preview"><img id="previewImg"><div><button id="save">Salvar</button> <button id="close">Voltar</button></div></div>
<script>
const $ = (s) => document.querySelector(s);
const video = $('#video');
const tag = $('#tag');
const shot = $('#shot');
const recordBtn = $('#record');
const stopBtn = $('#stop');
const canvas = $('#canvas');
const recCanvas = $('#recCanvas');
const previewImg = $('#previewImg');
const preview = $('#preview');
const flashScreen = $('#flashScreen');
const flipBtn = $('#flip');
const flashBtn = $('#flash');
const formatBtn = $('#format');
const photoMode = $('#photoMode');
const videoMode = $('#videoMode');
const saveBtn = $('#save');
const closeBtn = $('#close');
const lastBtn = $('#last');

const logo = new Image();
logo.src = 'logo-hydro.png';

let stream = null;
let front = true;
let flashArmed = false;
let area = 'geral';
let effect = 'natural';
let ratio = '9:16';
let recording = false;
let mediaRecorder = null;
let chunks = [];

const labels = {
  geral: 'CONECTA 2026 • GERAL',
  operacao: 'OPERAÇÃO DO SISTEMA ELÉTRICO',
  manutencao: 'MANUTENÇÃO DO SISTEMA ELÉTRICO',
  automacao: 'AUTOMAÇÃO'
};

const filters = {
  natural: 'none',
  vivo: 'saturate(1.35) contrast(1.08)',
  frio: 'saturate(.90) contrast(1.04) hue-rotate(12deg)',
  quente: 'sepia(.20) saturate(1.18) contrast(1.03)',
  pb: 'grayscale(1) contrast(1.12)'
};

function getRatioValue() {
  return ratio === '9:16' ? 9/16 : ratio === '4:5' ? 4/5 : 1;
}

async function openCam(facing) {
  if (stream) stream.getTracks().forEach(t => t.stop());

  stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: facing,
      width: { ideal: 1920 },
      height: { ideal: 1080 }
    },
    audio: true
  });

  video.srcObject = stream;
  await video.play();
  front = facing === 'user';
  video.classList.toggle('mirror', front);
}

openCam('user').catch(() => alert('Permita acesso à câmera e ao microfone.'));

flipBtn.addEventListener('click', async () => {
  if (recording) return;
  try {
    await openCam(front ? 'environment' : 'user');
  } catch {
    alert('Não foi possível trocar a câmera.');
  }
});

flashBtn.addEventListener('click', () => {
  flashArmed = !flashArmed;
  flashBtn.classList.toggle('on', flashArmed);
});

document.querySelectorAll('[data-area]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-area]').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    area = btn.dataset.area;
    tag.textContent = labels[area];
  });
});

document.querySelectorAll('[data-fx]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-fx]').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    effect = btn.dataset.fx;
    video.style.filter = filters[effect];
  });
});

formatBtn.addEventListener('click', () => {
  ratio = ratio === '9:16' ? '4:5' : ratio === '4:5' ? '1:1' : '9:16';
  formatBtn.textContent = ratio;
});

function setMode(mode) {
  const isPhoto = mode === 'foto';
  photoMode.classList.toggle('active', isPhoto);
  videoMode.classList.toggle('active', !isPhoto);
  shot.style.display = isPhoto ? 'block' : 'none';
  recordBtn.style.display = isPhoto ? 'none' : 'block';
  if (isPhoto) stopBtn.style.display = 'none';
}

photoMode.addEventListener('click', () => setMode('foto'));
videoMode.addEventListener('click', () => setMode('video'));

/* 
   Reproduz no canvas o MESMO enquadramento do <video object-fit:cover>.
   Depois recorta esse quadro para 9:16 / 4:5 / 1:1.
*/
function objectCoverSource(srcW, srcH, boxW, boxH) {
  const srcRatio = srcW / srcH;
  const boxRatio = boxW / boxH;

  if (srcRatio > boxRatio) {
    const cropW = srcH * boxRatio;
    return { sx: (srcW - cropW) / 2, sy: 0, sw: cropW, sh: srcH };
  } else {
    const cropH = srcW / boxRatio;
    return { sx: 0, sy: (srcH - cropH) / 2, sw: srcW, sh: cropH };
  }
}

function outputDimensions() {
  // Qualidade alta mantendo o formato selecionado.
  if (ratio === '9:16') return { w: 1080, h: 1920 };
  if (ratio === '4:5') return { w: 1080, h: 1350 };
  return { w: 1080, h: 1080 };
}

function drawCameraLikeScreen(ctx, w, h) {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return;

  const src = objectCoverSource(vw, vh, w, h);

  ctx.save();
  ctx.filter = filters[effect];

  if (front) {
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }

  ctx.drawImage(
    video,
    src.sx, src.sy, src.sw, src.sh,
    0, 0, w, h
  );
  ctx.restore();
}

function roundedRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function drawOverlayExactly(ctx, w, h) {
  const sx = w / Math.max(document.documentElement.clientWidth, 1);
  const sy = h / Math.max(document.documentElement.clientHeight, 1);
  const s = Math.min(sx, sy);

  // Mesmo sombreado da tela
  const top = ctx.createLinearGradient(0, 0, 0, h * .25);
  top.addColorStop(0, 'rgba(0,0,0,.60)');
  top.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = top;
  ctx.fillRect(0, 0, w, h * .28);

  const bottom = ctx.createLinearGradient(0, h * .60, 0, h);
  bottom.addColorStop(0, 'rgba(0,0,0,0)');
  bottom.addColorStop(1, 'rgba(0,0,0,.82)');
  ctx.fillStyle = bottom;
  ctx.fillRect(0, h * .58, w, h * .42);

  // Logo
  const left = 14 * sx;
  const topY = 14 * sy;
  const logoW = 72 * s;
  const logoH = 50 * s;

  if (logo.complete && logo.naturalWidth) {
    const r = Math.min(logoW / logo.naturalWidth, logoH / logo.naturalHeight);
    ctx.drawImage(logo, left, topY, logo.naturalWidth*r, logo.naturalHeight*r);
  }

  // Título exatamente próximo ao logo
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.95)';
  ctx.shadowBlur = 6 * s;
  ctx.textAlign = 'left';

  const titleX = left + 82 * s;
  ctx.font = `900 ${25*s}px Arial`;
  ctx.fillStyle = '#fff';
  ctx.fillText('CONECTA', titleX, topY + 23*s);
  const conectaWidth = ctx.measureText('CONECTA ').width;
  ctx.fillStyle = '#55cf67';
  ctx.fillText('2026', titleX + conectaWidth, topY + 23*s);

  ctx.fillStyle = '#fff';
  ctx.font = `700 ${10*s}px Arial`;
  ctx.fillText('Gerência de Energia e Automação', titleX, topY + 39*s);

  // Tag da área — mesma posição visual da tela
  const tagX = 14 * sx;
  const tagY = 83 * sy;
  const tagPadX = 10 * s;
  const tagPadY = 7 * s;
  ctx.font = `900 ${12*s}px Arial`;
  const textW = ctx.measureText(labels[area]).width;

  ctx.fillStyle = 'rgba(0,0,0,.55)';
  roundedRect(ctx, tagX, tagY, textW + tagPadX*2 + 4*s, 28*s, 3*s);
  ctx.fill();

  ctx.fillStyle = '#55cf67';
  ctx.fillRect(tagX, tagY, 3*s, 28*s);

  ctx.fillStyle = '#fff';
  ctx.fillText(labels[area], tagX + 9*s, tagY + 19*s);

  ctx.restore();
}

function renderFinal(targetCanvas) {
  const { w, h } = outputDimensions();
  targetCanvas.width = w;
  targetCanvas.height = h;
  const ctx = targetCanvas.getContext('2d');

  ctx.clearRect(0, 0, w, h);
  drawCameraLikeScreen(ctx, w, h);
  drawOverlayExactly(ctx, w, h);
}

async function takePhoto() {
  if (!stream || !video.videoWidth) return;

  if (flashArmed) {
    flashScreen.classList.add('fire');
    await new Promise(r => setTimeout(r, 140));
  }

  renderFinal(canvas);

  flashScreen.classList.remove('fire');
  previewImg.src = canvas.toDataURL('image/png', 1.0);
  preview.style.display = 'flex';
}

shot.addEventListener('click', takePhoto);

closeBtn.addEventListener('click', (ev) => {
  ev.preventDefault();
  preview.style.display = 'none';
});

saveBtn.addEventListener('click', (ev) => {
  ev.preventDefault();

  if (!previewImg.src || !previewImg.src.startsWith('data:image')) {
    alert('Tire uma foto antes de salvar.');
    return;
  }

  const a = document.createElement('a');
  a.href = previewImg.src;
  a.download = `conecta-2026-${area}-${ratio.replace(':','x')}.png`;
  document.body.appendChild(a);
  a.click();
  a.remove();
});

lastBtn.addEventListener('click', () => {
  if (previewImg.src && previewImg.src.startsWith('data:image')) {
    preview.style.display = 'flex';
  }
});

recordBtn.addEventListener('click', () => {
  if (!recCanvas.captureStream || !window.MediaRecorder) {
    alert('Vídeo não suportado neste navegador.');
    return;
  }

  const { w: baseW, h: baseH } = outputDimensions();
  const scale = Math.min(720 / baseW, 1);
  recCanvas.width = Math.round(baseW * scale);
  recCanvas.height = Math.round(baseH * scale);

  const ctx = recCanvas.getContext('2d');
  recording = true;
  chunks = [];

  function loop() {
    if (!recording) return;
    ctx.clearRect(0, 0, recCanvas.width, recCanvas.height);
    drawCameraLikeScreen(ctx, recCanvas.width, recCanvas.height);
    drawOverlayExactly(ctx, recCanvas.width, recCanvas.height);
    requestAnimationFrame(loop);
  }
  loop();

  const canvasStream = recCanvas.captureStream(24);
  const mixed = new MediaStream();

  canvasStream.getVideoTracks().forEach(t => mixed.addTrack(t));
  stream.getAudioTracks().forEach(t => mixed.addTrack(t));

  const opts = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
    ? { mimeType: 'video/webm;codecs=vp8,opus' }
    : {};

  mediaRecorder = new MediaRecorder(mixed, opts);
  mediaRecorder.ondataavailable = e => {
    if (e.data && e.data.size) chunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `conecta-2026-${area}-${ratio.replace(':','x')}.webm`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  };

  mediaRecorder.start();
  recordBtn.style.display = 'none';
  stopBtn.style.display = 'block';
});

stopBtn.addEventListener('click', () => {
  recording = false;
  if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
  stopBtn.style.display = 'none';
  recordBtn.style.display = 'block';
});
</script></body></html>
