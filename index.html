<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050705"><title>Conecta 2026 • Câmera Teste</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#fff}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}.mirror{transform:scaleX(-1)}
#shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#0009,transparent 25%,transparent 60%,#000e)}
header{position:fixed;z-index:5;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:10px}
#logo{width:72px;height:50px;object-fit:contain}.name{font-size:25px;font-weight:900}.name b{color:#55cf67}.sub{font-size:10px;font-weight:700}
#tag{position:fixed;z-index:5;top:83px;left:14px;border-left:3px solid #55cf67;background:#0008;padding:7px 10px;font-size:12px;font-weight:900}
#tools{position:fixed;z-index:10;right:12px;top:14px;display:flex;gap:7px}.tool{width:42px;height:42px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:19px}.tool.on{background:#55cf67;color:#071009}
#format{position:fixed;z-index:10;right:14px;top:64px;border:1px solid #ffffff55;background:#000a;color:#fff;border-radius:18px;padding:6px 10px}
#panel{position:fixed;z-index:10;bottom:10px;left:0;right:0}.row{display:flex;gap:7px;overflow-x:auto;padding:4px 12px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;border:1px solid #ffffff45;background:#080a08cc;color:#fff;border-radius:20px;padding:8px 11px;font-size:10px;font-weight:800}.pill.active{border-color:#55cf67;color:#8cff9b;background:#18351ddd}
#modes{text-align:center;font-size:11px;font-weight:800;margin:4px}#modes span{padding:5px 9px}#modes .active{color:#55cf67}
#captureRow{height:76px;display:flex;justify-content:center;align-items:center;gap:25px}.small{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff66;background:#090b09dd;color:#fff;font-size:20px}
#shot,#record{width:67px;height:67px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 3px #55cf67}#shot{background:transparent}#record{display:none;background:#d72e2e}#stop{display:none;background:#9b1d1d}
#flashScreen{position:fixed;z-index:30;inset:0;background:#fff;opacity:0;pointer-events:none}#flashScreen.fire{opacity:1}
#preview{display:none;position:fixed;z-index:40;inset:0;background:#050705;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:15px}#preview img{max-width:94vw;max-height:78vh;border-radius:12px}
#preview button{border:1px solid #55cf67;background:#111;color:#fff;border-radius:20px;padding:10px 15px;font-weight:700}
</style></head>
<body>
<video id="video" autoplay muted playsinline></video><div id="shade"></div>
<header><img id="logo" src="logo-hydro.png"><div><div class="name">CONECTA <b>2026</b></div><div class="sub">Gerência de Energia e Automação</div></div></header>
<div id="tag">CONECTA 2026 • GERAL</div>
<div id="tools"><button class="tool" id="flip">🔄</button><button class="tool" id="flash">⚡</button></div><button id="format">9:16</button>
<div id="panel"><div id="modes"><span id="photoMode" class="active">FOTO</span><span id="videoMode">VÍDEO</span></div>
<div class="row" id="areas"><button class="pill active" data-area="geral">GERAL</button><button class="pill" data-area="operacao">⚡ OPERAÇÃO</button><button class="pill" data-area="manutencao">🔧 MANUTENÇÃO</button><button class="pill" data-area="automacao">⚙ AUTOMAÇÃO</button></div>
<div class="row" id="effects"><button class="pill active" data-fx="natural">NATURAL</button><button class="pill" data-fx="vivo">VIVO</button><button class="pill" data-fx="frio">FRIO</button><button class="pill" data-fx="quente">QUENTE</button><button class="pill" data-fx="pb">P&B</button></div>
<div id="captureRow"><button class="small" id="last">▣</button><button id="shot"></button><button id="record"></button><button class="small" id="stop">■</button></div></div>
<div id="flashScreen"></div><canvas id="canvas" hidden></canvas><canvas id="recCanvas" hidden></canvas>
<div id="preview"><img id="previewImg"><div><button id="save">Salvar</button> <button id="close">Voltar</button></div></div>
<script>
const v=document.querySelector('#video'),tag=document.querySelector('#tag'),shot=document.querySelector('#shot'),record=document.querySelector('#record'),stopBtn=document.querySelector('#stop'),cv=document.querySelector('#canvas'),rcv=document.querySelector('#recCanvas'),pi=document.querySelector('#previewImg'),preview=document.querySelector('#preview'),logo=new Image();logo.src='logo-hydro.png';
let stream,front=true,armed=false,area='geral',fx='natural',ratio='9:16',recording=false,mr,chunks=[];
const labels={geral:'CONECTA 2026 • GERAL',operacao:'OPERAÇÃO DO SISTEMA ELÉTRICO',manutencao:'MANUTENÇÃO DO SISTEMA ELÉTRICO',automacao:'AUTOMAÇÃO'};
const foot={geral:'ENERGIA  •  OPERAÇÃO  •  MANUTENÇÃO  •  AUTOMAÇÃO',operacao:'⚡ OPERAÇÃO DO SISTEMA ELÉTRICO',manutencao:'🔧 MANUTENÇÃO DO SISTEMA ELÉTRICO',automacao:'⚙ AUTOMAÇÃO'};
const filters={natural:'none',vivo:'saturate(1.35) contrast(1.08)',frio:'saturate(.9) hue-rotate(12deg)',quente:'sepia(.2) saturate(1.18)',pb:'grayscale(1) contrast(1.12)'};
async function openCam(f){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:f,width:{ideal:1920},height:{ideal:1080}},audio:true});v.srcObject=stream;front=f==='user';v.classList.toggle('mirror',front)}
openCam('user').catch(()=>alert('Permita acesso à câmera e ao microfone.'));
flip.onclick=()=>{if(!recording)openCam(front?'environment':'user')};flash.onclick=()=>{armed=!armed;flash.classList.toggle('on',armed)};
document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-area]').forEach(x=>x.classList.remove('active'));b.classList.add('active');area=b.dataset.area;tag.textContent=labels[area]});
document.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-fx]').forEach(x=>x.classList.remove('active'));b.classList.add('active');fx=b.dataset.fx;v.style.filter=filters[fx]});
format.onclick=()=>{ratio=ratio==='9:16'?'4:5':ratio==='4:5'?'1:1':'9:16';format.textContent=ratio};
function mode(m){photoMode.classList.toggle('active',m==='foto');videoMode.classList.toggle('active',m==='video');shot.style.display=m==='foto'?'block':'none';record.style.display=m==='video'?'block':'none'}photoMode.onclick=()=>mode('foto');videoMode.onclick=()=>mode('video');
function dims(sw,sh){let r=ratio==='9:16'?9/16:ratio==='4:5'?4/5:1,sr=sw/sh,sx=0,sy=0,cw=sw,ch=sh;if(sr>r){cw=sh*r;sx=(sw-cw)/2}else{ch=sw/r;sy=(sh-ch)/2}return{sx,sy,cw,ch,w:Math.round(cw),h:Math.round(ch)}}
function brand(c,w,h){let a=c.createLinearGradient(0,0,0,h*.22);a.addColorStop(0,'#000b');a.addColorStop(1,'#0000');c.fillStyle=a;c.fillRect(0,0,w,h*.25);let b=c.createLinearGradient(0,h*.7,0,h);b.addColorStop(0,'#0000');b.addColorStop(1,'#000d');c.fillStyle=b;c.fillRect(0,h*.68,w,h*.32);if(logo.complete&&logo.naturalWidth){let mw=w*.2,mh=h*.08,r=Math.min(mw/logo.naturalWidth,mh/logo.naturalHeight);c.drawImage(logo,w*.04,h*.025,logo.naturalWidth*r,logo.naturalHeight*r)}c.shadowColor='#000';c.shadowBlur=7;c.textAlign='left';c.fillStyle='#fff';c.font=`900 ${w*.052}px Arial`;c.fillText('CONECTA',w*.28,h*.065);c.fillStyle='#55cf67';c.fillText('2026',w*.28,h*.115);c.fillStyle='#fff';c.font=`700 ${w*.021}px Arial`;c.fillText('Gerência de Energia e Automação',w*.28,h*.15);c.fillStyle='#55cf67';c.font=`800 ${w*.024}px Arial`;c.fillText(labels[area],w*.04,h*.205);c.textAlign='center';c.fillStyle='#fff';c.font=`800 ${w*.021}px Arial`;c.fillText(foot[area],w/2,h*.9)}
function draw(c,w,h){let d=dims(v.videoWidth,v.videoHeight);c.save();c.filter=filters[fx];if(front){c.translate(w,0);c.scale(-1,1)}c.drawImage(v,d.sx,d.sy,d.cw,d.ch,0,0,w,h);c.restore();brand(c,w,h)}
shot.onclick=async()=>{let d=dims(v.videoWidth,v.videoHeight);cv.width=d.w;cv.height=d.h;if(armed){flashScreen.classList.add('fire');await new Promise(r=>setTimeout(r,120))}draw(cv.getContext('2d'),cv.width,cv.height);flashScreen.classList.remove('fire');pi.src=cv.toDataURL('image/png');preview.style.display='flex'};
close.onclick=()=>preview.style.display='none';save.onclick=()=>{let a=document.createElement('a');a.href=pi.src;a.download=`conecta-2026-${area}.png`;a.click()};last.onclick=()=>{if(pi.src)preview.style.display='flex'};
record.onclick=()=>{if(!rcv.captureStream||!window.MediaRecorder)return alert('Vídeo não suportado neste navegador.');let d=dims(v.videoWidth,v.videoHeight),w=Math.min(720,d.w),h=Math.round(w*d.h/d.w);rcv.width=w;rcv.height=h;let c=rcv.getContext('2d');recording=true;chunks=[];function loop(){if(!recording)return;draw(c,w,h);requestAnimationFrame(loop)}loop();let cs=rcv.captureStream(24),mix=new MediaStream();cs.getVideoTracks().forEach(t=>mix.addTrack(t));stream.getAudioTracks().forEach(t=>mix.addTrack(t));mr=new MediaRecorder(mix);mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mr.onstop=()=>{let u=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType})),a=document.createElement('a');a.href=u;a.download=`conecta-2026-${area}.webm`;a.click()};mr.start();record.style.display='none';stopBtn.style.display='block'};
stopBtn.onclick=()=>{recording=false;if(mr?.state==='recording')mr.stop();stopBtn.style.display='none';record.style.display='block'};
</script></body></html>
