<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#444D55">
<title>Conecta 2026</title>
<style>
/* =========================================================
   PALETA DE CORES
   Troque os HEX abaixo para mudar as cores do aplicativo.
   ========================================================= */
:root{
  --slate:#444D55; /* cinza escuro principal */
  --steel:#768692; /* azul/cinza */
  --gray:#8C8C8C;  /* cinza médio */
  --teal:#43807A;  /* verde/azulado principal */
  --sand:#C5B9AC;  /* bege */
  --wine:#4A3041;  /* vinho/roxo */
  --rust:#B95946;  /* vermelho/laranja */
}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;color:#fff}
#app{position:fixed;inset:0;overflow:hidden;background:#111}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.mirror{transform:scaleX(-1)}
#overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,24,26,.62) 0%,transparent 22%,transparent 55%,rgba(15,18,19,.83) 79%,rgba(12,14,15,.97) 100%)}
/* =========================================================
   CABEÇALHO: LOGO HYDRO + CONECTA 2026
   POSIÇÃO:
   - top: aumenta = desce / diminui = sobe
   - width: largura total do cabeçalho
   ========================================================= */
#header{
  position:absolute;
  top:max(17px,env(safe-area-inset-top)); /* MUDE AQUI para subir/descer o cabeçalho */
  left:50%;
  transform:translateX(-50%);
  width:min(78vw,390px); /* MUDE AQUI para aumentar/diminuir a largura */
  display:flex;
  justify-content:center;
  align-items:center;
  gap:13px; /* espaço entre logo e texto */
}
/* TAMANHO DO LOGO HYDRO */
#logo{
  width:138px;   /* MUDE AQUI a largura do logo */
  height:108px;  /* MUDE AQUI a altura do logo */
  object-fit:contain;
  filter:drop-shadow(0 2px 5px #000);
}
#brandText{border-left:2px solid rgba(255,255,255,.8);padding-left:13px}
#title{font-weight:900;font-size:clamp(24px,7vw,35px);line-height:.87;text-shadow:0 2px 5px #000}
#title span{display:block;color:var(--teal)}
#dept{font-size:clamp(9px,2.5vw,12px);font-weight:700;line-height:1.1;margin-top:6px;text-shadow:0 2px 4px #000}
/* =========================================================
   NOME DA ÁREA NA FOTO
   Ex.: OPERAÇÃO DO SISTEMA ELÉTRICO
   POSIÇÃO:
   - bottom maior = sobe
   - bottom menor = desce
   ========================================================= */
#areaTitle{
  position:absolute;
  left:10px;
  right:10px;
  bottom:10.8%; /* MUDE AQUI para subir/descer o nome da área */
  text-align:center;
  color:var(--teal);
  font-size:clamp(24px,7vw,38px); /* MUDE AQUI o tamanho do texto */
  letter-spacing:4px; /* espaçamento entre letras */
  font-weight:800;
  text-shadow:0 3px 8px #000;
}
/* FRASE "Na Alunorte nós inovamos"
   margin-top maior = afasta mais do nome da área */
#tagline{
  display:block;
  margin-top:12px; /* MUDE AQUI a distância para o título da área */
  color:var(--sand);
  font-size:clamp(14px,4vw,20px); /* MUDE AQUI o tamanho da frase */
  letter-spacing:0;
  font-weight:500;
}
.themeIcon{position:absolute;font-size:clamp(24px,6.5vw,36px);filter:drop-shadow(0 3px 5px #000);opacity:.85}
/* =========================================================
   POSIÇÃO DOS 8 EMOJIS DA MOLDURA
   - left/right controla a distância da borda
   - top controla a altura
   ========================================================= */
.i1{left:5%; top:18%}  /* canto/lado esquerdo superior */
.i2{right:5%;top:19%}  /* lado direito superior */
.i3{left:5%; top:36%}
.i4{right:5%;top:38%}
.i5{left:5%; top:53%}
.i6{right:5%;top:54%}
.i7{left:5%; top:68%}
.i8{right:5%;top:68%}
/* =========================================================
   BOTÕES SUPERIORES: TROCAR CÂMERA E FLASH
   top controla a altura.
   left/right controlam distância das bordas.
   ========================================================= */
#topTools{
  position:absolute;
  z-index:10;
  top:max(15px,env(safe-area-inset-top)); /* MUDE AQUI para subir/descer */
  left:10px;  /* distância da esquerda */
  right:10px; /* distância da direita */
  display:flex;
  justify-content:space-between;
}
.tool{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:26px;text-shadow:0 2px 5px #000}.tool.on{color:var(--rust)}
/* =========================================================
   BLOCO INFERIOR DE CONTROLES
   height maior = ocupa mais espaço para cima.
   bottom maior = sobe todo o bloco.
   ========================================================= */
#controls{
  position:absolute;
  z-index:11;
  left:0;
  right:0;
  bottom:max(4px,env(safe-area-inset-bottom)); /* MUDE AQUI para subir o bloco */
  height:31%; /* MUDE AQUI a altura total dos controles */
}
/* =========================================================
   SELETOR DE ÁREA: GERAL / OPERAÇÃO / MANUTENÇÃO / AUTOMAÇÃO
   POSIÇÃO:
   - bottom maior = sobe
   - bottom menor = desce
   - left/right = largura nas laterais
   - height = altura da caixa
   ========================================================= */
#areas{
  position:absolute;
  left:4%;   /* MUDE AQUI a margem esquerda */
  right:4%;  /* MUDE AQUI a margem direita */
  bottom:0;  /* MUDE AQUI para subir/descer o seletor de área */
  height:58px; /* MUDE AQUI a altura */
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  padding:0;
  border:1px solid rgba(197,185,172,.35);
  border-radius:16px;
  overflow:hidden;
  background:rgba(20,24,26,.72);
  backdrop-filter:blur(5px);
}
.areaBtn{border:0;border-right:1px solid rgba(197,185,172,.18);background:transparent;color:var(--gray);font-weight:800;font-size:clamp(8px,2.2vw,11px);padding:5px 2px}.areaBtn:last-child{border-right:0}.areaBtn .aico{display:block;font-size:19px;margin-bottom:3px}
.areaBtn.active{color:var(--teal);background:rgba(67,128,122,.12)}
/* =========================================================
   LINHA DO BOTÃO DE DISPARO + FILTROS + FOTO/VÍDEO
   bottom controla a distância acima do seletor de área.
   ========================================================= */
#bottomRow{
  position:absolute;
  left:0;
  right:0;
  bottom:144px; /* MUDE AQUI para subir/descer o disparador e filtros */
  height:82px;
  display:flex;
  align-items:center;
  justify-content:center;
}
/* POSIÇÃO DOS TEXTOS FOTO / VÍDEO */
#modes{
  position:absolute;
  left:4%;      /* MUDE AQUI para mover para direita/esquerda */
  bottom:17px;  /* MUDE AQUI para subir/descer */
  font-size:11px;
}.mode{margin:0 5px;color:var(--gray);font-weight:800}.mode.active{color:var(--teal)}
/* =========================================================
   BOTÃO CENTRAL DE FOTO / VÍDEO
   - left: 50% = centro horizontal
   - top: 50% = centro vertical dentro de #bottomRow
   - width/height = tamanho
   ========================================================= */
#shot,#record,#stop{
  position:absolute;
  z-index:20;
  left:50%; /* MUDE AQUI para mover horizontalmente */
  top:50%;  /* MUDE AQUI para mover verticalmente */
  transform:translate(-50%,-50%);
  width:70px;  /* tamanho do botão */
  height:70px; /* tamanho do botão */
  border-radius:50%;
  border:5px solid #fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.7);
}
#shot{background:#fff}#record{display:none;background:var(--rust)}#stop{display:none;background:var(--rust);color:#fff;font-size:22px}
/* =========================================================
   FILTROS: NATURAL / VIVO / FRIO / QUENTE / P&B
   - right controla posição horizontal
   - width controla largura da faixa
   - bottom controla altura
   ========================================================= */
#effects{
  position:absolute;
  right:2%; /* MUDE AQUI para mover filtros para esquerda/direita */
  left:auto;
  width:39%; /* MUDE AQUI a largura dos filtros */
  bottom:7px; /* MUDE AQUI para subir/descer */
  display:flex;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:none;
}#effects::-webkit-scrollbar{display:none}
.effect{flex:0 0 49px;height:59px;border:2px solid transparent;border-radius:12px;padding:36px 2px 2px;background:linear-gradient(135deg,var(--steel),var(--teal));color:#fff;font-size:8px}
.effect:nth-child(2){background:linear-gradient(135deg,var(--teal),var(--sand))}.effect:nth-child(3){background:linear-gradient(135deg,var(--steel),var(--gray))}
.effect:nth-child(4){background:linear-gradient(135deg,var(--rust),var(--sand))}.effect:nth-child(5){background:linear-gradient(135deg,#333,#aaa)}
.effect.active{border-color:var(--teal)}
#flashScreen{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}#flashScreen.fire{opacity:1}
#preview{display:none;position:fixed;inset:0;z-index:40;background:#15191b;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:14px}
#previewImg{max-width:94vw;max-height:78vh;border-radius:12px}
.previewBtns{display:flex;gap:8px}.previewBtns button{border:1px solid var(--teal);background:var(--slate);color:#fff;border-radius:20px;padding:12px 18px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay muted playsinline></video>
  <div id="overlay">
    <!-- ======================================================
     CABEÇALHO VISUAL
     Troque textos e logo aqui.
     ====================================================== -->
    <div id="header">
      <img id="logo" src="logo-hydro.png" alt="Hydro">
      <div id="brandText">
        <div id="title">CONECTA <span>2026</span></div>
        <div id="dept">GERÊNCIA DE ENERGIA<br>E AUTOMAÇÃO</div>
      </div>
    </div>
    <!-- Nome da área e frase inferior -->
    <div id="areaTitle">CONECTA<span id="tagline">Na Alunorte nós inovamos</span></div>
    <span class="themeIcon i1"></span><span class="themeIcon i2"></span><span class="themeIcon i3"></span><span class="themeIcon i4"></span>
    <span class="themeIcon i5"></span><span class="themeIcon i6"></span><span class="themeIcon i7"></span><span class="themeIcon i8"></span>
  </div>

  <!-- Botões de trocar câmera e flash -->
  <div id="topTools">
    <button class="tool" id="flip" title="Trocar câmera">🔄</button>
    <button class="tool" id="flash">⚡</button>
  </div>

  <!-- ======================================================
     CONTROLES INFERIORES
     ====================================================== -->
  <div id="controls">
    <div id="areas">
      <button class="areaBtn active" data-area="geral"><span class="aico">🏠</span>GERAL</button>
      <button class="areaBtn" data-area="operacao"><span class="aico">🖥️</span>OPERAÇÃO</button>
      <button class="areaBtn" data-area="manutencao"><span class="aico">🔧</span>MANUTENÇÃO</button>
      <button class="areaBtn" data-area="automacao"><span class="aico">🤖</span>AUTOMAÇÃO</button>
    </div>

    <div id="bottomRow">
      <div id="modes"><span id="photoMode" class="mode active">FOTO</span><span id="videoMode" class="mode">VÍDEO</span></div>
      <button id="shot"></button><button id="record"></button><button id="stop">■</button>
      <div id="effects">
        <button class="effect active" data-fx="natural">NATURAL</button>
        <button class="effect" data-fx="vivo">VIVO</button>
        <button class="effect" data-fx="frio">FRIO</button>
        <button class="effect" data-fx="quente">QUENTE</button>
        <button class="effect" data-fx="pb">P&B</button>
      </div>
    </div>
  </div>
</div>

<div id="flashScreen"></div>
<canvas id="canvas" hidden></canvas>
<canvas id="recCanvas" hidden></canvas>
<div id="preview"><img id="previewImg"><div class="previewBtns"><button id="save">Salvar</button><button id="close">Voltar</button></div></div>

<script>
const $=s=>document.querySelector(s);
const video=$('#video'),flashBtn=$('#flash'),flipBtn=$('#flip'),shot=$('#shot'),recordBtn=$('#record'),stopBtn=$('#stop');
const canvas=$('#canvas'),recCanvas=$('#recCanvas'),preview=$('#preview'),previewImg=$('#previewImg'),flashScreen=$('#flashScreen');
const areaTitle=$('#areaTitle'),photoMode=$('#photoMode'),videoMode=$('#videoMode'),logoImg=new Image();logoImg.src='logo-hydro.png';

let stream=null,front=true,flashArmed=false,area='geral',effect='natural',recording=false,mediaRecorder=null,chunks=[];

/* =========================================================
   TEXTOS DAS ÁREAS
   MUDE AQUI os nomes que aparecem na tela e na foto salva.
   ========================================================= */
const labels={
  geral:'GS ENERGIA E AUTOMAÇÃO',
  operacao:'OPERAÇÃO DO SISTEMA ELÉTRICO',
  manutencao:'MANUTENÇÃO DO SISTEMA ELÉTRICO',
  automacao:'AUTOMAÇÃO'
};
/* CORES DO TÍTULO DE CADA ÁREA */
const colors={
  geral:'#43807A',
  operacao:'#43807A',
  manutencao:'#B95946',
  automacao:'#4A3041'
};
/* =========================================================
   EMOJIS DE CADA ÁREA
   São 8 emojis por área.
   A ordem corresponde às classes .i1 até .i8 no CSS.
   ========================================================= */
const themes={
  geral:['⚡','🖥️','🔧','⚙️','🤖','💻','📡','🛠️'],
  operacao:['⚡','🖥️','📊','🎛️','📟','🔌','🛰️','🛡️'],
  manutencao:['🔧','🛠️','⚙️','🧰','🔩','🪛','📏','🔌'],
  automacao:['🤖','🦾','💻','⌨️','📡','⚙️','🧠','💾']
};
/* =========================================================
   EFEITOS DE IMAGEM
   Ajuste os valores abaixo se quiser mudar a aparência dos filtros.
   ========================================================= */
const filters={
  natural:'none',
  vivo:'saturate(1.35) contrast(1.08)',
  frio:'saturate(.9) hue-rotate(12deg)',
  quente:'sepia(.2) saturate(1.18)',
  pb:'grayscale(1) contrast(1.12)'
};

function refreshTheme(){
  areaTitle.firstChild.nodeValue=labels[area];
  areaTitle.style.color=colors[area];
  document.querySelectorAll('.themeIcon').forEach((e,i)=>e.textContent=themes[area][i]);
}
refreshTheme();

async function openCam(facing){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:true});
  video.srcObject=stream;await video.play();front=facing==='user';video.classList.toggle('mirror',front);
}
openCam('user').catch(()=>alert('Permita acesso à câmera e ao microfone.'));

flipBtn.onclick=()=>{if(!recording)openCam(front?'environment':'user').catch(()=>alert('Não foi possível trocar a câmera.'))};
flashBtn.onclick=()=>{flashArmed=!flashArmed;flashBtn.classList.toggle('on',flashArmed)};

document.querySelectorAll('.areaBtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.areaBtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');area=b.dataset.area;refreshTheme()
});
document.querySelectorAll('.effect').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.effect').forEach(x=>x.classList.remove('active'));b.classList.add('active');effect=b.dataset.fx;video.style.filter=filters[effect]
});
photoMode.onclick=()=>{photoMode.classList.add('active');videoMode.classList.remove('active');shot.style.display='block';recordBtn.style.display='none';stopBtn.style.display='none'};
videoMode.onclick=()=>{videoMode.classList.add('active');photoMode.classList.remove('active');shot.style.display='none';recordBtn.style.display='block'};

/* TAMANHO FIXO DA FOTO SALVA: 9:16
   1080 x 1920 = padrão Story.
   Se um dia quiser alterar a resolução, mude aqui. */
function outSize(){
  return {w:1080,h:1920};
}
function cover(sw,sh,w,h){let sr=sw/sh,br=w/h;if(sr>br){let cw=sh*br;return{sx:(sw-cw)/2,sy:0,sw:cw,sh}}else{let ch=sw/br;return{sx:0,sy:(sh-ch)/2,sw,sh:ch}}}
function draw(ctx,w,h){
  let d=cover(video.videoWidth,video.videoHeight,w,h);ctx.save();ctx.filter=filters[effect];
  if(front){ctx.translate(w,0);ctx.scale(-1,1)}
  ctx.drawImage(video,d.sx,d.sy,d.sw,d.sh,0,0,w,h);ctx.restore();

  let tg=ctx.createLinearGradient(0,0,0,h*.23);tg.addColorStop(0,'rgba(20,24,26,.7)');tg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=tg;ctx.fillRect(0,0,w,h*.27);
  let bg=ctx.createLinearGradient(0,h*.58,0,h);bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,'rgba(12,14,15,.93)');ctx.fillStyle=bg;ctx.fillRect(0,h*.55,w,h*.45);

  if(logoImg.complete&&logoImg.naturalWidth){let mw=w*.2,mh=h*.07,r=Math.min(mw/logoImg.naturalWidth,mh/logoImg.naturalHeight);ctx.drawImage(logoImg,w*.27,h*.025,logoImg.naturalWidth*r,logoImg.naturalHeight*r)}
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=w*.002;ctx.beginPath();ctx.moveTo(w*.49,h*.025);ctx.lineTo(w*.49,h*.12);ctx.stroke();
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font=`900 ${w*.05}px Arial`;ctx.fillText('CONECTA',w*.52,h*.06);ctx.fillStyle='#43807A';ctx.fillText('2026',w*.52,h*.105);
  ctx.fillStyle='#fff';ctx.font=`700 ${w*.018}px Arial`;ctx.fillText('GERÊNCIA DE ENERGIA',w*.52,h*.135);ctx.fillText('E AUTOMAÇÃO',w*.52,h*.16);

  /* =========================================================
     POSIÇÃO DOS TEXTOS NA FOTO SALVA
     IMPORTANTE: isso controla a posição NO ARQUIVO GERADO,
     não apenas na tela.

     h*.84  -> nome da área
     h*.895 -> frase "Na Alunorte nós inovamos"

     Aumentar 0.84 para 0.88 = desce.
     Diminuir 0.84 para 0.80 = sobe.
     ========================================================= */
  ctx.textAlign='center';
  ctx.fillStyle=colors[area];
  ctx.font=`800 ${w*.055}px Arial`; /* tamanho do nome da área */
  ctx.fillText(labels[area],w/2,h*.84); /* POSIÇÃO VERTICAL DO NOME DA ÁREA */

  ctx.fillStyle='#C5B9AC';
  ctx.font=`800 ${w*.028}px Arial`; /* tamanho da frase */
  ctx.fillText('Na Alunorte nós inovamos',w/2,h*.895); /* POSIÇÃO VERTICAL DA FRASE */

  /* POSIÇÃO DOS EMOJIS NA FOTO SALVA.
     Cada número representa uma altura.
     Aumentar = desce. Diminuir = sobe. */
  ctx.font=`${w*.035}px Arial`; /* tamanho dos emojis na foto salva */
  let ys=[h*.22,h*.38,h*.54,h*.66];
  themes[area].slice(0,4).forEach((ic,i)=>ctx.fillText(ic,w*.07,ys[i]));
  themes[area].slice(4).forEach((ic,i)=>ctx.fillText(ic,w*.93,ys[i]));
}

shot.onclick=async()=>{
  if(!video.videoWidth)return;
  if(flashArmed){flashScreen.classList.add('fire');await new Promise(r=>setTimeout(r,120))}
  let s=outSize();canvas.width=s.w;canvas.height=s.h;draw(canvas.getContext('2d'),s.w,s.h);flashScreen.classList.remove('fire');
  previewImg.src=canvas.toDataURL('image/png');preview.style.display='flex'
};
$('#close').onclick=()=>preview.style.display='none';
$('#save').onclick=()=>{if(!previewImg.src)return;let a=document.createElement('a');a.href=previewImg.src;a.download=`conecta-2026-${area}-9x16.png`;document.body.appendChild(a);a.click();a.remove()};

recordBtn.onclick=()=>{
  if(!recCanvas.captureStream||!window.MediaRecorder)return alert('Vídeo não suportado neste navegador.');
  let s=outSize(),scale=Math.min(720/s.w,1);recCanvas.width=Math.round(s.w*scale);recCanvas.height=Math.round(s.h*scale);
  let ctx=recCanvas.getContext('2d');recording=true;chunks=[];
  function loop(){if(!recording)return;draw(ctx,recCanvas.width,recCanvas.height);requestAnimationFrame(loop)}loop();
  let cs=recCanvas.captureStream(24),mix=new MediaStream();cs.getVideoTracks().forEach(t=>mix.addTrack(t));stream.getAudioTracks().forEach(t=>mix.addTrack(t));
  mediaRecorder=new MediaRecorder(mix,MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?{mimeType:'video/webm;codecs=vp8,opus'}:{});
  mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mediaRecorder.onstop=()=>{let u=URL.createObjectURL(new Blob(chunks,{type:mediaRecorder.mimeType||'video/webm'})),a=document.createElement('a');a.href=u;a.download=`conecta-2026-${area}.webm`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)};
  mediaRecorder.start();recordBtn.style.display='none';stopBtn.style.display='block'
};
stopBtn.onclick=()=>{recording=false;if(mediaRecorder?.state==='recording')mediaRecorder.stop();stopBtn.style.display='none';recordBtn.style.display='block'};
</script>
</body>
</html>
